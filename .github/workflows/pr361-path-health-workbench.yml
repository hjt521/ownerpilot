name: PR361 LA path-health workbench

on:
  push:
    branches:
      - fix/la-jurisdiction-path-specific-health-gate

permissions:
  contents: write

jobs:
  implement-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert exact reviewed base
        run: |
          test "$(git rev-parse HEAD^)" = "5805d8aea1ba740839ea1dd45afd7c774fa0ab83"
          test "$(git diff --name-only HEAD^..HEAD)" = ".github/workflows/pr361-path-health-workbench.yml"
      - name: Apply bounded path-specific source-health patch
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              s = p.read_text()
              if s.count(old) != 1:
                  raise SystemExit(f"{path}: expected exactly one replacement target, found {s.count(old)}")
              p.write_text(s.replace(old, new, 1))

          # 1) Add source-specific health evaluation while preserving the existing whole-set gate.
          path = 'lib/jurisdiction/parcelHealthGate.ts'
          insert_after = """export function evaluateParcelHealthGate(
            rows: ParcelHealthStatusRow[],
            now: Date,
            windowMs: number = PARCEL_HEALTH_FRESHNESS_WINDOW_MS,
          ): ParcelHealthGateResult {
            const byEndpoint = new Map(rows.map((r) => [r.endpoint, r]));
            const closures: GateClosure[] = [];

            for (const endpoint of PARCEL_HEALTH_GATE_ENDPOINTS) {
              const row = byEndpoint.get(endpoint);
              if (!row || row.lastProbeAt == null) {
                closures.push({ endpoint, condition: 'missing' });
                continue;
              }
              if (row.currentStatus !== 'live') {
                closures.push({ endpoint, condition: 'not_live' });
                continue;
              }
              const age = now.getTime() - Date.parse(row.lastProbeAt);
              if (age > windowMs) {
                closures.push({ endpoint, condition: 'stale' });
              }
            }

            return closures.length === 0
              ? { open: true, closures: [] }
              : { open: false, closures };
          }
          """
          source_eval = insert_after + """
          /**
           * Path-specific variant of the same health/currentness rule. It evaluates ONLY the
           * source the resolver is about to consume; the other parcel source cannot close this
           * check merely because it is not required on the current branch. Missing rows,
           * not_live, null last_probe_at, and >75-minute staleness retain the exact fail-closed
           * semantics of evaluateParcelHealthGate.
           */
          export function evaluateParcelSourceHealth(
            rows: ParcelHealthStatusRow[],
            endpoint: ParcelHealthEndpoint,
            now: Date,
            windowMs: number = PARCEL_HEALTH_FRESHNESS_WINDOW_MS,
          ): ParcelHealthGateResult {
            const row = rows.find((candidate) => candidate.endpoint === endpoint);
            let closure: GateClosure | null = null;
            if (!row || row.lastProbeAt == null) {
              closure = { endpoint, condition: 'missing' };
            } else if (row.currentStatus !== 'live') {
              closure = { endpoint, condition: 'not_live' };
            } else {
              const age = now.getTime() - Date.parse(row.lastProbeAt);
              if (age > windowMs) closure = { endpoint, condition: 'stale' };
            }
            return closure === null
              ? { open: true, closures: [] }
              : { open: false, closures: [closure] };
          }
          """
          replace_once(path, insert_after, source_eval)

          marker = """function defaultLog(event: string, fields: Record<string, unknown>): void {
            // eslint-disable-next-line no-console
            console.warn(JSON.stringify({ level: 'warn', event, ...fields }));
          }
          """
          source_live = marker + """
          /** Source-specific dynamic gate options used by the resolver immediately before a
           * County or ZIMAS lookup. The static six-predicate gate remains a prerequisite. */
          export interface LaParcelSourceLiveOptions {
            deps?: LaProductionDependencies;
            endpoint: ParcelHealthEndpoint;
            reader: ParcelHealthReader;
            now?: () => Date;
            windowMs?: number;
            logClosure?: (info: { reason: 'health_read'; closures: GateClosure[] }) => void;
            logReadError?: (info: {
              reason: 'health_read_error';
              endpoint: ParcelHealthEndpoint;
              error: string;
            }) => void;
          }

          /**
           * Read fresh rolled-up health and fail closed for exactly one required source.
           * No caching, retry, timeout, freshness, or writer-threshold semantics are changed.
           */
          export async function isLaParcelSourceLive(opts: LaParcelSourceLiveOptions): Promise<boolean> {
            const deps = opts.deps ?? LA_PRODUCTION_DEPENDENCIES;
            if (!isLaProductionUnblocked(deps)) return false;

            const now = (opts.now ?? (() => new Date()))();
            let rows: ParcelHealthStatusRow[];
            try {
              rows = await opts.reader.read();
            } catch (e) {
              (opts.logReadError ?? ((i) => defaultLog(i.reason, { endpoint: i.endpoint, error: i.error })))(
                { reason: 'health_read_error', endpoint: opts.endpoint, error: String(e) },
              );
              return false;
            }

            const result = evaluateParcelSourceHealth(rows, opts.endpoint, now, opts.windowMs);
            if (!result.open) {
              (opts.logClosure ?? ((i) => defaultLog(i.reason, { closures: i.closures })))(
                { reason: 'health_read', closures: result.closures },
              );
              return false;
            }
            return true;
          }
          """
          replace_once(path, marker, source_live)

          # 2) Move dynamic parcel health from a whole-resolver conjunction to each source boundary.
          path = 'lib/jurisdiction/geocode/resolveLaAddressV2.ts'
          replace_once(
              path,
              "import { isLaProductionLive, type ParcelHealthReader } from '../parcelHealthGate';",
              """import {
            isLaParcelSourceLive,
            type ParcelHealthEndpoint,
            type ParcelHealthReader,
          } from '../parcelHealthGate';
          import { isLaProductionUnblocked } from '../laRtcRules';""",
          )
          replace_once(
              path,
              """ * GATE: the orchestrator asserts the LA production gate at entry. A test hook may inject
           * `gateIsOpen` (sync); otherwise the dynamic parcel-health gate (isLaProductionLive) reads
           * parcel_health_status with the 75-min freshness guard once the static predicate flag is true,
           * and short-circuits closed while it is false. No reader + no override → fail closed. Flips no
           * flag; makes no live call while the gate is closed.
          """,
              """ * GATE: the orchestrator preserves the static LA production gate at entry. Dynamic parcel
           * health is asserted only at the source boundary being consumed: County immediately before
           * County lookup, and ZIMAS only if the existing County classifier reaches the ZIMAS fallback.
           * Each assertion uses the existing 75-minute freshness/current_status rules and fails closed.
           * A test hook may inject `gateIsOpen`; no reader + no override fails closed before source use.
          """,
          )
          interface_marker = """export interface ResolverV2Deps {
            /** Returns the pre-parcel signals from Google (AV + reverse geocode). */
            fetchGeocodeSignals: (inputAddress: string) => Promise<{
              validationGranularity?: ValidationGranularity;
              formattedAddress?: string;
              latitude?: number;
              longitude?: number;
              locality: string | null;
              administrativeAreaLevel1: string | null;
              correction: CorrectionFlags;
            }>;
            county: CountySpatialLookupDeps;
            zimas: ZimasLookupDeps;
            gateIsOpen?: () => boolean;
            /** Dynamic parcel-health gate reader (predicate-6). Injected in production by
             *  buildResolverDeps; absent in unit tests, which inject `gateIsOpen` instead. */
            parcelHealthReader?: ParcelHealthReader;
            /** Optional sink for the audit record (A.6). Defaults to no-op. */
            recordAudit?: (record: GeocodeAuditRecord) => Promise<void> | void;
          }
          """
          interface_new = """export interface ResolverV2Deps {
            /** Returns the pre-parcel signals from Google (AV + reverse geocode). */
            fetchGeocodeSignals: (inputAddress: string) => Promise<{
              validationGranularity?: ValidationGranularity;
              formattedAddress?: string;
              latitude?: number;
              longitude?: number;
              locality: string | null;
              administrativeAreaLevel1: string | null;
              correction: CorrectionFlags;
            }>;
            county: CountySpatialLookupDeps;
            zimas: ZimasLookupDeps;
            /** Explicit test override for the static/source health gate. Production omits it. */
            gateIsOpen?: () => boolean;
            /** Narrow reader used for fresh path-specific County/ZIMAS health assertions. */
            parcelHealthReader?: ParcelHealthReader;
            /** Optional sink for the audit record (A.6). Defaults to no-op. */
            recordAudit?: (record: GeocodeAuditRecord) => Promise<void> | void;
          }

          async function assertRequiredParcelSourceLive(
            endpoint: ParcelHealthEndpoint,
            deps: ResolverV2Deps,
          ): Promise<void> {
            // Existing test override means the caller already asserted the gate at entry; preserve
            // that seam without introducing a second health substrate into the existing corpus.
            if (deps.gateIsOpen !== undefined) return;
            const live = deps.parcelHealthReader
              ? await isLaParcelSourceLive({ endpoint, reader: deps.parcelHealthReader })
              : false;
            if (!live) {
              throw new Error(`la-prod-gate-closed: ${endpoint} source unavailable`);
            }
          }
          """
          replace_once(path, interface_marker, interface_new)
          old_gate = """  // Gate: a test/override sync predicate if injected; otherwise the dynamic parcel-health gate
            // (isLaProductionLive — static short-circuit when the predicate flag is false, else reads
            // parcel_health_status with the 75-min freshness guard). No reader + no override → fail closed.
            const gateOpen: () => boolean | Promise<boolean> =
              deps.gateIsOpen ??
              (() => (deps.parcelHealthReader ? isLaProductionLive({ reader: deps.parcelHealthReader }) : false));
            if (!(await gateOpen())) {
              throw new Error('la-prod-gate-closed: geocode resolver must not run while the LA production gate is closed');
            }
          """
          new_gate = """  // Preserve the static six-predicate go-live assertion at resolver entry so a closed
            // feature/control gate still makes no Google or parcel live calls. Dynamic endpoint health
            // is no longer a global County+ZIMAS conjunction; it is asserted immediately before the
            // source that the existing classifier actually needs.
            const staticGateOpen: () => boolean | Promise<boolean> =
              deps.gateIsOpen ?? (() => isLaProductionUnblocked());
            if (!(await staticGateOpen())) {
              throw new Error('la-prod-gate-closed: geocode resolver must not run while the LA production gate is closed');
            }
          """
          replace_once(path, old_gate, new_gate)
          replace_once(
              path,
              """  const county = await lookupCountyParcelSpatial(lat, lng, deps.county);
          """,
              """  await assertRequiredParcelSourceLive('county', deps);
            const county = await lookupCountyParcelSpatial(lat, lng, deps.county);
          """,
          )
          replace_once(
              path,
              """  // STEP 5 (ZIMAS) — County inconclusive (and not a non-LA situs gap). The
            // coordinate was already validated above (both parcel sources share it).
            const zimas = await lookupZimasParcel(lat, lng, deps.zimas);
          """,
              """  // STEP 5 (ZIMAS) — County inconclusive (and not a non-LA situs gap). The
            // coordinate was already validated above (both parcel sources share it). ZIMAS health
            // is asserted only now because this is the first branch that actually consumes ZIMAS.
            await assertRequiredParcelSourceLive('zimas', deps);
            const zimas = await lookupZimasParcel(lat, lng, deps.zimas);
          """,
          )

          # 3) Keep production dependency wiring the same; correct only its now-stale comments.
          path = 'app/api/notice/geocode/route.ts'
          replace_once(
              path,
              """  // Predicate-6 dynamic gate reader: narrow-read of parcel_health_status under the
            // parcel_health_reader JWT (no Supabase client; static Bearer over the global fetch,
            // mirroring readBlockState §3.1). While parcelEndpointHealthCheckLive is false,
            // isLaProductionLive short-circuits closed BEFORE this reader is ever called, so this
            // wiring is behavior-neutral until the flag flips (predicate-6 ruling, Slice 1).
          """,
              """  // Predicate-6 source-health reader: narrow-read of parcel_health_status under the
            // parcel_health_reader JWT (no Supabase client; static Bearer over the global fetch,
            // mirroring readBlockState §3.1). The resolver uses this same reader to assert County
            // health before County evidence and ZIMAS health only when the fallback branch needs it.
          """,
          )
          replace_once(
              path,
              """    // gateIsOpen omitted → resolver uses the dynamic parcel-health gate (isLaProductionLive),
              // which short-circuits closed while the predicate flag is false (same gate-closed behavior
              // as before this wiring). The PAGE-SIDE gate check (4d) still governs invocation.
          """,
              """    // gateIsOpen omitted → resolver preserves the static gate at entry, then performs
              // fresh path-specific source-health assertions before County/ZIMAS consumption. The
              // PAGE-SIDE static gate check (4d) still governs normal invocation.
          """,
          )

          # 4) Extend the existing parcel-health boundary suite with path-specific locks.
          path = 'lib/jurisdiction/parcelHealthGate.test.ts'
          replace_once(
              path,
              """  evaluateParcelHealthGate,
            isLaProductionLive,
          """,
              """  evaluateParcelHealthGate,
            evaluateParcelSourceHealth,
            isLaProductionLive,
            isLaParcelSourceLive,
          """,
          )
          summary_marker = """  console.log('\\n----------------------------------------');
            console.log(`  ${passed} passed, ${failed} failed`);
          """
          source_tests = """  console.log('\\n=== path-specific source health (same freshness semantics) ===');
            {
              const r = evaluateParcelSourceHealth(
                [row('county','live',fresh), row('zimas','not_live',fresh)], 'county', NOW,
              );
              check('county live/fresh stays OPEN when zimas is not_live', r.open === true);
            }
            {
              const r = evaluateParcelSourceHealth([row('county','live',fresh)], 'zimas', NOW);
              check('required zimas row missing → CLOSED', r.open === false);
              check('  source closure identifies zimas missing',
                !r.open && r.closures.length === 1 && r.closures[0].endpoint === 'zimas' && r.closures[0].condition === 'missing');
            }
            {
              const r = evaluateParcelSourceHealth(
                [row('zimas','live',ago(75*MIN + 1000))], 'zimas', NOW,
              );
              check('required zimas >75m stale → CLOSED', r.open === false && r.closures[0]?.condition === 'stale');
            }
            {
              const r = evaluateParcelSourceHealth(
                [row('county','live',ago(75*MIN))], 'county', NOW,
              );
              check('path-specific age exactly 75:00 remains FRESH', r.open === true);
            }
            {
              let readerCalled = false;
              const spy: ParcelHealthReader = { read: async () => { readerCalled = true; return []; } };
              const open = await isLaParcelSourceLive({
                deps: FLAG_FALSE, endpoint: 'county', reader: spy, now: () => NOW,
              });
              check('source health preserves static-false short-circuit', open === false && readerCalled === false);
            }
            {
              let errorEndpoint = '';
              const open = await isLaParcelSourceLive({
                deps: ALL_TRUE,
                endpoint: 'zimas',
                reader: throwingReader,
                now: () => NOW,
                logReadError: (i) => { errorEndpoint = i.endpoint; },
              });
              check('required-source read error → fail CLOSED', open === false);
              check('  read-error observability identifies zimas', errorEndpoint === 'zimas');
            }

          """ + summary_marker
          replace_once(path, summary_marker, source_tests)

          # 5) Add deterministic A-J resolver scenario matrix.
          Path('lib/jurisdiction/geocode/pathSpecificSourceHealth.test.ts').write_text(r'''import { resolveLaAddressV2, type ResolverV2Deps } from './resolveLaAddressV2';
          import type { ParsedParcelRecord } from './countyParcelAdapter';
          import type { ZimasParcelRecord } from './zimasParcelAdapter';
          import type { ParcelHealthReader, ParcelHealthStatusRow } from '../parcelHealthGate';

          let passed = 0, failed = 0;
          function check(name: string, cond: boolean) {
            if (cond) { passed++; console.log('  ✓ ' + name); }
            else { failed++; console.log('  ✗ ' + name); }
          }

          const county = (taxRateCity: string | null): ParsedParcelRecord => ({
            taxRateCity, situsCity: 'LOS ANGELES CA', ain: 'A', apn: 'P',
          });
          const zimas = (cnclDist: string | null, tract: string | null): ZimasParcelRecord => ({
            pind: 'PI', pin: 'PN', tract, cnclDist,
          });
          const fresh = () => new Date().toISOString();
          const stale = () => new Date(Date.now() - 76 * 60 * 1000).toISOString();
          const health = (
            endpoint: 'county' | 'zimas', currentStatus: 'live' | 'not_live', lastProbeAt: string | null,
          ): ParcelHealthStatusRow => ({ endpoint, currentStatus, lastProbeAt });

          interface Options {
            healthRows?: ParcelHealthStatusRow[];
            healthReader?: ParcelHealthReader;
            countyRecords?: ParsedParcelRecord[];
            zimasRecords?: ZimasParcelRecord[];
            correction?: { hasReplacedComponents?: boolean; possibleNextAction?: string };
            counters?: { county: number; zimas: number; healthReads: number };
          }

          function deps(opts: Options): ResolverV2Deps {
            const counters = opts.counters ?? { county: 0, zimas: 0, healthReads: 0 };
            const reader = opts.healthReader ?? {
              read: async () => { counters.healthReads++; return opts.healthRows ?? []; },
            };
            return {
              fetchGeocodeSignals: async () => ({
                validationGranularity: 'PREMISE',
                formattedAddress: '1100 Wilshire Blvd, Los Angeles, CA 90017',
                latitude: 34.05,
                longitude: -118.26,
                locality: 'Los Angeles',
                administrativeAreaLevel1: 'California',
                correction: opts.correction ?? {},
              }),
              county: {
                fetcher: async () => {
                  counters.county++;
                  return opts.countyRecords ?? [];
                },
              },
              zimas: {
                fetcher: async () => {
                  counters.zimas++;
                  return opts.zimasRecords ?? [];
                },
              },
              parcelHealthReader: reader,
            };
          }

          async function gateClosed(run: () => Promise<unknown>, source: 'county' | 'zimas'): Promise<boolean> {
            try {
              await run();
              return false;
            } catch (e) {
              return e instanceof Error && e.message === `la-prod-gate-closed: ${source} source unavailable`;
            }
          }

          async function main() {
            console.log('\n=== LA path-specific source health scenarios A-J ===');

            // A — County decisive LA result does not depend on ZIMAS health.
            {
              const c = { county: 0, zimas: 0, healthReads: 0 };
              const r = await resolveLaAddressV2('x', deps({
                counters: c,
                healthRows: [health('county','live',fresh()), health('zimas','not_live',fresh())],
                countyRecords: [county('LOS ANGELES')],
              }));
              check('A: County healthy + ZIMAS not_live + County LA → confirmed_la', r.disposition === 'confirmed_la' && r.audit.branch === 'county_confirm');
              check('A: ZIMAS lookup not consumed', c.zimas === 0);
            }

            // B — County decisive non-LA result survives any irrelevant ZIMAS health state.
            for (const [label, rows] of [
              ['missing', [health('county','live',fresh())]],
              ['stale', [health('county','live',fresh()), health('zimas','live',stale())]],
              ['not_live', [health('county','live',fresh()), health('zimas','not_live',fresh())]],
            ] as const) {
              const r = await resolveLaAddressV2('x', deps({ healthRows: [...rows], countyRecords: [county('SANTA MONICA')] }));
              check(`B: ZIMAS ${label} + County deny → not_la`, r.disposition === 'not_la' && r.audit.branch === 'county_deny');
            }

            // C — Existing ZIMAS fallback behavior when both required sources are healthy.
            {
              const r = await resolveLaAddressV2('x', deps({
                healthRows: [health('county','live',fresh()), health('zimas','live',fresh())],
                countyRecords: [], zimasRecords: [zimas('11', 'TR 9358')],
              }));
              check('C: County inconclusive + ZIMAS healthy confirm → existing zimas_confirm', r.disposition === 'confirmed_la' && r.audit.branch === 'zimas_confirm');
            }

            // D — ZIMAS required but not_live: fail closed, not manual_review.
            {
              const c = { county: 0, zimas: 0, healthReads: 0 };
              const closed = await gateClosed(() => resolveLaAddressV2('x', deps({
                counters: c,
                healthRows: [health('county','live',fresh()), health('zimas','not_live',fresh())],
                countyRecords: [], zimasRecords: [zimas('11', 'TR 9358')],
              })), 'zimas');
              check('D: County inconclusive + ZIMAS not_live → fail closed', closed);
              check('D: unavailable ZIMAS evidence is never consumed', c.zimas === 0);
            }

            // E — ZIMAS required but stale: same fail-closed architecture.
            {
              const closed = await gateClosed(() => resolveLaAddressV2('x', deps({
                healthRows: [health('county','live',fresh()), health('zimas','live',stale())],
                countyRecords: [],
              })), 'zimas');
              check('E: County inconclusive + ZIMAS stale → fail closed', closed);
            }

            // F — County is always health-gated before County evidence, independent of ZIMAS.
            for (const [label, countyRow] of [
              ['missing', null],
              ['stale', health('county','live',stale())],
              ['not_live', health('county','not_live',fresh())],
            ] as const) {
              const c = { county: 0, zimas: 0, healthReads: 0 };
              const rows = [health('zimas','live',fresh())];
              if (countyRow) rows.push(countyRow);
              const closed = await gateClosed(() => resolveLaAddressV2('x', deps({
                counters: c, healthRows: rows, countyRecords: [county('LOS ANGELES')],
              })), 'county');
              check(`F: County ${label} → fail closed`, closed && c.county === 0);
            }

            // G — Read failure for the source actually required by the branch fails closed.
            {
              const closed = await gateClosed(() => resolveLaAddressV2('x', deps({
                healthReader: { read: async () => { throw new Error('health db unavailable'); } },
                countyRecords: [county('LOS ANGELES')],
              })), 'county');
              check('G1: County health read error → fail closed', closed);
            }
            {
              let reads = 0;
              const reader: ParcelHealthReader = {
                read: async () => {
                  reads++;
                  if (reads === 1) return [health('county','live',fresh())];
                  throw new Error('health db unavailable');
                },
              };
              const closed = await gateClosed(() => resolveLaAddressV2('x', deps({
                healthReader: reader, countyRecords: [], zimasRecords: [zimas('11','TR 9358')],
              })), 'zimas');
              check('G2: ZIMAS-required health read error → fail closed', closed && reads === 2);
            }

            // H — Corrected positive County evidence remains suppressed exactly as before.
            {
              const r = await resolveLaAddressV2('x', deps({
                healthRows: [health('county','live',fresh()), health('zimas','not_live',fresh())],
                countyRecords: [county('LOS ANGELES')],
                correction: { hasReplacedComponents: true },
              }));
              check('H: corrected County confirmation → manual_review input_corrected', r.disposition === 'manual_review' && r.reviewReason === 'input_corrected' && r.audit.branch === 'correction_suppressed');
            }

            // I — Healthy ZIMAS fallback that does not confirm keeps existing manual-review result.
            {
              const r = await resolveLaAddressV2('x', deps({
                healthRows: [health('county','live',fresh()), health('zimas','live',fresh())],
                countyRecords: [], zimasRecords: [zimas('OUTLA', ' ')],
              }));
              check('I: nonconfirming ZIMAS → existing parcel_lookup_inconclusive', r.disposition === 'manual_review' && r.reviewReason === 'parcel_lookup_inconclusive' && r.audit.branch === 'zimas_miss');
              check('I: ZIMAS never manufactures not_la', r.disposition !== ('not_la' as unknown));
            }

            // J — Source outage is a gate-closed throw; no resolver fallback verdict is manufactured.
            {
              const c = { county: 0, zimas: 0, healthReads: 0 };
              const closed = await gateClosed(() => resolveLaAddressV2('x', deps({
                counters: c,
                healthRows: [health('county','live',fresh()), health('zimas','not_live',fresh())],
                countyRecords: [], zimasRecords: [zimas('11','TR 9358')],
              })), 'zimas');
              check('J: source outage remains gate_closed architecture, not manual_review/not_la', closed && c.zimas === 0);
            }

            console.log('\n----------------------------------------');
            console.log(`  ${passed} passed, ${failed} failed`);
            console.log('----------------------------------------');
            if (failed > 0) process.exit(1);
          }

          main().catch((e) => { console.error(e); process.exit(1); });
          '''.replace('          ', ''))

          # 6) Lock broker-confirm against outage/error expansion.
          Path('lib/decision2/__tests__/brokerConfirmOutageEligibility.test.ts').write_text(r'''import { submitSchema } from '../schemas';

          let passed = 0, failed = 0;
          function check(name: string, cond: boolean) {
            if (cond) { passed++; console.log('  ✓ ' + name); }
            else { failed++; console.log('  ✗ ' + name); }
          }

          const base = {
            addressRaw: '123 Main St, Los Angeles, CA 90012',
            priorResolverVerdict: 'manual_review',
          } as const;

          console.log('\n=== broker-confirm outage boundary ===');
          check('existing parcel_lookup_inconclusive remains eligible',
            submitSchema.safeParse({ ...base, priorReviewReason: 'parcel_lookup_inconclusive' }).success);
          check('existing county_situs_gap remains eligible',
            submitSchema.safeParse({ ...base, priorReviewReason: 'county_situs_gap' }).success);
          check('existing county_ambiguous remains eligible',
            submitSchema.safeParse({ ...base, priorReviewReason: 'county_ambiguous' }).success);

          for (const reason of ['api_error', 'resolution_failed', 'gate_closed', 'source_health_outage']) {
            check(`${reason} is NOT a broker-confirm review reason`,
              !submitSchema.safeParse({ ...base, priorReviewReason: reason }).success);
          }
          check('resolution_failed verdict cannot enter broker-confirm even with an allowed reason',
            !submitSchema.safeParse({
              ...base,
              priorResolverVerdict: 'resolution_failed',
              priorReviewReason: 'parcel_lookup_inconclusive',
            }).success);
          check('gate_closed verdict cannot enter broker-confirm even with an allowed reason',
            !submitSchema.safeParse({
              ...base,
              priorResolverVerdict: 'gate_closed',
              priorReviewReason: 'parcel_lookup_inconclusive',
            }).success);

          console.log(`\n  ${passed} passed, ${failed} failed`);
          if (failed > 0) process.exit(1);
          '''.replace('          ', ''))
          PY
