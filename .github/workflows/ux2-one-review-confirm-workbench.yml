name: UX2 One Review Confirm Workbench

on:
  push:
    branches:
      - fix/nonpayment-one-review-confirm

permissions:
  contents: write

jobs:
  implement-and-verify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply bounded UX2 implementation
        run: python scripts/ux2_one_review_confirm_workbench.py
      - name: Rebind material-mutation gate tests
        run: python scripts/ux2_one_review_confirm_test_rebind.py
      - name: Apply bounded integration fixes
        run: python scripts/ux2_one_review_confirm_integration_fix.py
      - name: Remove temporary workbench files
        run: rm scripts/ux2_one_review_confirm_workbench.py scripts/ux2_one_review_confirm_test_rebind.py scripts/ux2_one_review_confirm_integration_fix.py .github/workflows/ux2-one-review-confirm-workbench.yml
      - name: Install dependencies
        run: npm install
      - name: Focused UX2 approval binding
        run: npx tsx lib/flow/reviewApproval.test.ts
      - name: Focused advancement
        run: npx tsx lib/flow/advancement.test.ts
      - name: Focused production gate
        run: npx tsx lib/flow/gates.v4.test.ts
      - name: Focused Create and Notice Ready boundary
        run: npx tsx lib/flow/noticeReadyTaskBoundary.test.ts
      - name: Focused persistence
        run: npx tsx lib/flow/persistence.test.ts
      - name: Focused existing staleness
        run: npx tsx lib/flow/escalation.test.ts
      - name: Focused renderer
        run: npx tsx lib/produce/renderNotice.test.ts
      - name: Focused packet builder
        run: npx tsx lib/produce/buildPacketHtml.test.ts
      - name: Focused chat mapping
        run: npx tsx lib/chat/toNoticeFlowData.test.ts
      - name: Focused chat review produce
        run: npx tsx lib/chat/reviewProduce.test.ts
      - name: Focused chat staleness
        run: npx tsx lib/chat/stalenessCheck.test.ts
      - name: Focused intended service date
        run: npx tsx lib/dates/intendedServiceDate.test.ts
      - name: Focused compliance date engine
        run: npx tsx lib/dates/computeCompliancePeriod.test.ts
      - name: Focused payment methods
        run: npx tsx lib/payments/validatePaymentMethods.test.ts
      - name: PR 361 source health regression
        run: npx tsx lib/jurisdiction/geocode/pathSpecificSourceHealth.test.ts
      - name: Full repository tests
        run: npm test
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Edge function typecheck
        run: npm run ci:typecheck-edge
      - name: Locked prose
        run: npm run ci:verify-locked-prose
      - name: Banned terms
        run: npm run ci:verify-banned-terms
      - name: Attorney attribution guard
        run: npm run ci:check-attorney-attribution
      - name: Classifier lock
        run: npm run ci:verify-classifier-lock
      - name: Geocode failure event lock
        run: npm run ci:verify-geocode-failure-event
      - name: Fetch binding lock
        run: npm run ci:verify-fetch-binding
      - name: Parcel health core sync
        run: npm run ci:verify-parcel-health-core-sync
      - name: Diff whitespace
        run: git diff --check
      - name: Commit verified candidate
        run: |
          git config user.name "ownerpilot-workbench"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(nonpayment): bind final confirmation to exact create state"
          git push origin HEAD:fix/nonpayment-one-review-confirm
