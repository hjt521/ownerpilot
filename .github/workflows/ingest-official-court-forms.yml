name: Ingest official court forms (one-time)

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  ingest:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'docs/official-court-form-registry-2026-08-12'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact PR head
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ github.token }}
          fetch-depth: 0

      - name: Download only exact Founder-supplied official blanks
        shell: bash
        run: |
          set -euo pipefail

          download_verified() {
            id="$1"
            target="$2"
            expected="$3"
            shift 3
            mkdir -p "$(dirname "$target")"
            tmp="$(mktemp)"
            for url in "$@"; do
              echo "Trying $id from $url"
              if curl --fail --location --silent --show-error --retry 2 --connect-timeout 20 --max-time 120 "$url" -o "$tmp"; then
                actual="$(sha256sum "$tmp" | awk '{print $1}')"
                if [ "$actual" = "$expected" ]; then
                  mv "$tmp" "$target"
                  echo "$id verified: $expected"
                  return 0
                fi
                echo "Hash mismatch for $id from $url: $actual"
              fi
              : > "$tmp"
            done
            rm -f "$tmp"
            echo "No authoritative candidate yielded the Founder-supplied SHA-256 for $id" >&2
            return 1
          }

          download_verified \
            "UD-100" \
            "docs/legal/official-forms/california/judicial-council/UD-100/2026-07-01/UD-100.pdf" \
            "1dbc18fb4639fb2939a2df60a6401941b058296a7f521bd56b62cc0d08610496" \
            "https://www.courts.ca.gov/documents/ud100.pdf" \
            "https://courts.ca.gov/documents/ud100.pdf" \
            "https://courts.ca.gov/sites/default/files/courts/default/2024-11/ud100.pdf"

          download_verified \
            "UD-101" \
            "docs/legal/official-forms/california/judicial-council/UD-101/2024-01-01/UD-101.pdf" \
            "f7fd185b679b883f6e9fb04d546ca1156aa50a78cbc8986948d9a52bcc454327" \
            "https://www.courts.ca.gov/documents/ud101.pdf" \
            "https://courts.ca.gov/documents/ud101.pdf" \
            "https://courts.ca.gov/sites/default/files/courts/default/2024-11/ud101.pdf"

          download_verified \
            "SUM-130" \
            "docs/legal/official-forms/california/judicial-council/SUM-130/2026-01-01/SUM-130.pdf" \
            "e07013e53be4ea69e70aed48a21fe762e85b3eade8214e52fdc430c116b4233d" \
            "https://www.courts.ca.gov/documents/sum130.pdf" \
            "https://courts.ca.gov/documents/sum130.pdf" \
            "https://courts.ca.gov/sites/default/files/courts/default/2024-11/sum130.pdf"

          download_verified \
            "CM-010" \
            "docs/legal/official-forms/california/judicial-council/CM-010/2026-07-01/CM-010.pdf" \
            "2e97e4010e077b4d2da33847802806e33b7bee0a39f020fb7b3b6be644f37c55" \
            "https://www.courts.ca.gov/documents/cm010.pdf" \
            "https://courts.ca.gov/documents/cm010.pdf" \
            "https://courts.ca.gov/sites/default/files/courts/default/2024-11/cm010.pdf"

          download_verified \
            "POS-010" \
            "docs/legal/official-forms/california/judicial-council/POS-010/2007-01-01/POS-010.pdf" \
            "09b82292b517ea81b7a223a6902f44206645ce6ea8c5ede5b54b8d51bfddfa38" \
            "https://www.courts.ca.gov/documents/pos010.pdf" \
            "https://courts.ca.gov/documents/pos010.pdf" \
            "https://courts.ca.gov/sites/default/files/courts/default/2024-11/pos010.pdf"

          download_verified \
            "CP10.5" \
            "docs/legal/official-forms/california/judicial-council/CP10.5/2015-06-15/CP10.5.pdf" \
            "3ec9d72449ba41463f1424fcb483d8c225446f1bc845cfabf788e7fc2716ce42" \
            "https://www.courts.ca.gov/documents/cp105.pdf" \
            "https://courts.ca.gov/documents/cp105.pdf" \
            "https://courts.ca.gov/sites/default/files/courts/default/2024-11/cp105.pdf"

          download_verified \
            "LACIV109" \
            "docs/legal/official-forms/los-angeles/superior-court/LACIV109/2023-01/LACIV109.pdf" \
            "dbe11b364f3e46857d77bf52a623bedb270596ecfa0cdeabfad5388c70f50c19" \
            "https://www.lacourt.org/forms/pdf/LACIV109.pdf" \
            "https://www.lacourt.ca.gov/forms/pdf/LACIV109.pdf"

          download_verified \
            "LASC CIV 312" \
            "docs/legal/official-forms/los-angeles/superior-court/CIV312/2025-10/CIV312.pdf" \
            "f27059765f500b0b62b00b0a382641c80763673233fecd0d4d4a740852c9ae1f" \
            "https://lascpubstorage.blob.core.windows.net/cpw/LIBSVCCommunications-83-CIV312.pdf"

      - name: Generate controlled manifest and reverify every binary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          forms = [
            {
              "form_id": "UD-100",
              "title": "Complaint—Unlawful Detainer",
              "issuing_authority": "Judicial Council of California",
              "jurisdiction": "California",
              "revision_effective": "2026-07-01",
              "page_count": 4,
              "artifact_class": "official_blank",
              "workflow_stage": ["initial_filing"],
              "repository_path": "docs/legal/official-forms/california/judicial-council/UD-100/2026-07-01/UD-100.pdf",
              "founder_supplied_filename": "ud100-7.pdf",
              "sha256": "1dbc18fb4639fb2939a2df60a6401941b058296a7f521bd56b62cc0d08610496",
              "acroform_field_count": 332,
              "nonempty_field_count": 0,
              "source_page": "https://selfhelp.courts.ca.gov/jcc-form/UD-100"
            },
            {
              "form_id": "UD-101",
              "title": "Plaintiff's Mandatory Cover Sheet and Supplemental Allegations—Unlawful Detainer",
              "issuing_authority": "Judicial Council of California",
              "jurisdiction": "California",
              "revision_effective": "2024-01-01",
              "page_count": 2,
              "artifact_class": "official_blank",
              "workflow_stage": ["initial_filing", "service_with_summons"],
              "repository_path": "docs/legal/official-forms/california/judicial-council/UD-101/2024-01-01/UD-101.pdf",
              "founder_supplied_filename": "ud101.pdf",
              "sha256": "f7fd185b679b883f6e9fb04d546ca1156aa50a78cbc8986948d9a52bcc454327",
              "acroform_field_count": 80,
              "nonempty_field_count": 0,
              "source_page": "https://selfhelp.courts.ca.gov/find-forms"
            },
            {
              "form_id": "SUM-130",
              "title": "Summons—Eviction (Unlawful Detainer / Forcible Detainer / Forcible Entry)",
              "issuing_authority": "Judicial Council of California",
              "jurisdiction": "California",
              "revision_effective": "2026-01-01",
              "page_count": 2,
              "artifact_class": "official_blank",
              "workflow_stage": ["initial_filing", "court_issuance", "service"],
              "repository_path": "docs/legal/official-forms/california/judicial-council/SUM-130/2026-01-01/SUM-130.pdf",
              "founder_supplied_filename": "sum130.pdf",
              "sha256": "e07013e53be4ea69e70aed48a21fe762e85b3eade8214e52fdc430c116b4233d",
              "acroform_field_count": 72,
              "nonempty_field_count": 0,
              "source_page": "https://selfhelp.courts.ca.gov/jcc-form/SUM-130"
            },
            {
              "form_id": "CM-010",
              "title": "Civil Case Cover Sheet",
              "issuing_authority": "Judicial Council of California",
              "jurisdiction": "California",
              "revision_effective": "2026-07-01",
              "page_count": 3,
              "artifact_class": "official_blank",
              "workflow_stage": ["initial_filing"],
              "repository_path": "docs/legal/official-forms/california/judicial-council/CM-010/2026-07-01/CM-010.pdf",
              "founder_supplied_filename": "cm010.pdf",
              "sha256": "2e97e4010e077b4d2da33847802806e33b7bee0a39f020fb7b3b6be644f37c55",
              "acroform_field_count": 117,
              "nonempty_field_count": 0,
              "source_page": "https://selfhelp.courts.ca.gov/jcc-form/CM-010"
            },
            {
              "form_id": "POS-010",
              "title": "Proof of Service of Summons",
              "issuing_authority": "Judicial Council of California",
              "jurisdiction": "California",
              "revision_effective": "2007-01-01",
              "page_count": 2,
              "artifact_class": "official_blank",
              "workflow_stage": ["post_filing_service_proof"],
              "repository_path": "docs/legal/official-forms/california/judicial-council/POS-010/2007-01-01/POS-010.pdf",
              "founder_supplied_filename": "pos010.pdf",
              "sha256": "09b82292b517ea81b7a223a6902f44206645ce6ea8c5ede5b54b8d51bfddfa38",
              "acroform_field_count": 157,
              "nonempty_field_count": 0,
              "source_page": "https://selfhelp.courts.ca.gov/jcc-form/POS-010"
            },
            {
              "form_id": "CP10.5",
              "title": "Prejudgment Claim of Right to Possession",
              "issuing_authority": "Judicial Council of California",
              "jurisdiction": "California",
              "revision_effective": "2015-06-15",
              "page_count": 2,
              "artifact_class": "official_blank",
              "workflow_stage": ["service_unknown_occupants"],
              "repository_path": "docs/legal/official-forms/california/judicial-council/CP10.5/2015-06-15/CP10.5.pdf",
              "founder_supplied_filename": "cp105.pdf",
              "sha256": "3ec9d72449ba41463f1424fcb483d8c225446f1bc845cfabf788e7fc2716ce42",
              "acroform_field_count": 51,
              "nonempty_field_count": 0,
              "source_page": "https://selfhelp.courts.ca.gov/jcc-form/CP10.5"
            },
            {
              "form_id": "LACIV109",
              "title": "Civil Case Cover Sheet Addendum and Statement of Location",
              "issuing_authority": "Superior Court of California, County of Los Angeles",
              "jurisdiction": "Los Angeles County, California",
              "revision_effective": "2023-01",
              "page_count": 5,
              "artifact_class": "official_blank",
              "workflow_stage": ["initial_filing", "local_location_assignment"],
              "repository_path": "docs/legal/official-forms/los-angeles/superior-court/LACIV109/2023-01/LACIV109.pdf",
              "founder_supplied_filename": "laciv109.pdf",
              "sha256": "dbe11b364f3e46857d77bf52a623bedb270596ecfa0cdeabfad5388c70f50c19",
              "acroform_field_count": 100,
              "nonempty_field_count": 0,
              "source_page": "https://www.lacourt.org/forms/civil",
              "deduplication_note": "Founder-supplied laciv109-2.pdf matched this artifact byte-for-byte and was not ingested separately."
            },
            {
              "form_id": "LASC-CIV-312",
              "title": "Unlawful Detainer Cellular Telephone Information",
              "issuing_authority": "Superior Court of California, County of Los Angeles",
              "jurisdiction": "Los Angeles County, California",
              "revision_effective": "2025-10",
              "page_count": 1,
              "artifact_class": "official_blank",
              "workflow_stage": ["initial_filing", "limited_jurisdiction_unlawful_detainer"],
              "repository_path": "docs/legal/official-forms/los-angeles/superior-court/CIV312/2025-10/CIV312.pdf",
              "founder_supplied_filename": "LIBSVCCommunications-83-CIV312.pdf",
              "sha256": "f27059765f500b0b62b00b0a382641c80763673233fecd0d4d4a740852c9ae1f",
              "acroform_field_count": 22,
              "nonempty_field_count": 0,
              "source_page": "https://www.lacourt.org/forms/civil"
            }
          ]

          for form in forms:
            path = Path(form["repository_path"])
            data = path.read_bytes()
            if not data.startswith(b"%PDF-"):
              raise SystemExit(f"{form['form_id']} is not a PDF")
            actual = hashlib.sha256(data).hexdigest()
            if actual != form["sha256"]:
              raise SystemExit(f"{form['form_id']} hash mismatch after materialization: {actual}")
            form["repository_status"] = "present_hash_verified"

          manifest = {
            "registry_version": 1,
            "created_on": "2026-08-12",
            "scope": "OwnerPilot controlled official blank court-form source registry",
            "governance_status": "NON-PRODUCTION SOURCE ARTIFACTS",
            "source_provenance": "Founder-supplied blank PDFs. Form identity, page count, fillable-field blankness, and SHA-256 were inspected before ingestion. Repository binaries were materialized only when authoritative-source downloads exactly matched the Founder-supplied SHA-256.",
            "blankness_verification": {
              "method": "PDF AcroForm inspection plus rendered/parsed form review",
              "accepted_values": "No nonempty field values; /Off checkbox state is treated as blank.",
              "verified_on": "2026-08-12"
            },
            "binary_ingestion_status": "complete_hash_verified",
            "binary_ingestion_verified_on": "2026-08-12",
            "forms": forms
          }

          out = Path("docs/legal/official-forms/manifest.json")
          out.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          PY

      - name: Commit exact binaries, manifest, and remove this one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/ingest-official-court-forms.yml
          git config user.name "OwnerPilot Repository Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A docs/legal/official-forms .github/workflows/ingest-official-court-forms.yml
          git commit -m "docs(legal): ingest hash-verified official court forms"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
