name: Matter Hydration v1A Workbench

on:
  push:
    branches:
      - fix/nonpayment-matter-hydration-v1a

permissions:
  contents: write

jobs:
  verify-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/nonpayment-matter-hydration-v1a
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Align temporary patcher with exact current identifiers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/matter_hydration_v1a_fix.py')
          s = p.read_text()
          anchor = "    text = text.replace(old, new, 1)\n\n"
          helper = "    text = text.replace(old, new, 1)\n\n\ndef replace_first(old: str, new: str):\n    global text\n    if old not in text:\n        raise SystemExit(f'expected occurrence: {old[:120]!r}')\n    text = text.replace(old, new, 1)\n\n"
          if s.count(anchor) != 1:
              raise SystemExit('replace_once anchor changed')
          s = s.replace(anchor, helper, 1)
          target = "replace_once(\n    'className=\"fixed top-4 right-4 z-50 w-[calc(100%-2rem)] max-w-sm flex flex-wrap items-center justify-between gap-3 rounded-lg border border-rule bg-white px-4 py-3 shadow-lg sm:w-auto\"'"
          if s.count(target) != 2:
              raise SystemExit(f'expected two shared-class calls, found {s.count(target)}')
          s = s.replace(target, target.replace('replace_once(', 'replace_first('))
          s = s.replace('signerAuthorityEvidenceOnFile', 'authorityEvidenceOnFile')
          s = s.replace('eftPreviouslyEstablishedAttested', 'eftPreviouslyEstablishedConfirmed')
          p.write_text(s)
          PY

      - name: Apply bounded v1A correction
        run: python3 scripts/matter_hydration_v1a_fix.py

      - name: Remove temporary workbench artifacts
        run: |
          rm .github/workflows/matter-hydration-v1a-workbench.yml
          rm scripts/matter_hydration_v1a_fix.py

      - name: Pre-test diff check
        run: git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Focused hydration and persistence
        run: |
          npx tsx lib/flow/matterHydration.test.ts
          npx tsx lib/flow/persistence.test.ts
          npx tsx lib/flow/reviewApproval.test.ts
          npx tsx lib/flow/createdNoticeArtifact.test.ts
          npx tsx lib/flow/noticeReadyTaskBoundary.test.ts
          npx tsx lib/chat/reviewProduce.test.ts
          npx tsx lib/flow/gates.v4.test.ts
          npx tsx lib/jurisdiction/geocode/pathSpecificSourceHealth.test.ts

      - name: Full repository tests
        run: npm test

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Edge typecheck
        run: npm run ci:typecheck-edge

      - name: Control guards
        run: |
          npm run ci:verify-locked-prose
          npm run ci:verify-banned-terms
          npm run ci:check-attorney-attribution
          npm run ci:verify-classifier-lock
          npm run ci:verify-geocode-failure-event
          npm run ci:verify-fetch-binding
          npm run ci:verify-parcel-health-core-sync
          npm run ci:verify-edge-core-sync

      - name: Post-test diff check
        run: git diff --check

      - name: Verify bounded scope and commit
        run: |
          git status --short
          git add components/notice-flow.tsx lib/flow/matterHydration.ts lib/flow/matterHydration.test.ts .github/workflows/matter-hydration-v1a-workbench.yml scripts/matter_hydration_v1a_fix.py
          git diff --cached --check
          git config user.name 'ownerpilot-workbench'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'fix(nonpayment): clarify browser-local fact reuse'
          git push origin HEAD:fix/nonpayment-matter-hydration-v1a
