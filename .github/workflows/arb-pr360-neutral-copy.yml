name: PR360 ARB neutral planned-date revision

on:
  push:
    branches:
      - fix/nonpayment-notice-ready-task-boundary

permissions:
  contents: write

jobs:
  revise-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/nonpayment-notice-ready-task-boundary
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Apply bounded ARB revision
        shell: python
        run: |
          from pathlib import Path

          flow_path = Path('components/notice-flow.tsx')
          flow = flow_path.read_text()
          old = """        This preview uses your planned service date and the existing date engine. It does\n        not record service. If the notice is served on a different date, return and\n        regenerate it before recording what actually happened in Serve &amp; Track.\n"""
          new = """        This preview uses your planned service date and the existing date engine. It does\n        not record service. If the plan changes before service, update the planned service\n        date here. After service occurs, record the actual service event in Serve &amp; Track.\n"""
          assert flow.count(old) == 1, 'expected disputed copy exactly once'
          flow = flow.replace(old, new)
          assert 'If the notice is served on a different date' not in flow
          assert 'regenerate it before recording what actually happened' not in flow
          flow_path.write_text(flow)

          test_path = Path('lib/flow/noticeReadyTaskBoundary.test.ts')
          test = test_path.read_text()
          anchor = """ok(\n  noticeFlow.includes('It does not record service.'),\n  'planned-date helper explicitly says it does not record service',\n);\n"""
          addition = anchor + """ok(\n  noticeFlow.includes('If the plan changes before service, update the planned service'),\n  'planned-date preview only instructs pre-service plan updates',\n);\nok(\n  noticeFlow.includes('After service occurs, record the actual service event in Serve &amp; Track.'),\n  'planned-date preview sends later actual service to Serve & Track without mismatch adjudication',\n);\nok(\n  !noticeFlow.includes('If the notice is served on a different date'),\n  'planned-date preview does not decide a post-service date mismatch',\n);\nok(\n  !noticeFlow.includes('regenerate it before recording what actually happened'),\n  'unauthorized regenerate-before-recording instruction is absent',\n);\n"""
          assert test.count(anchor) == 1, 'expected focused-test anchor exactly once'
          test = test.replace(anchor, addition)
          test_path.write_text(test)

      - name: Verify bounded diff
        run: |
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "components/notice-flow.tsx lib/flow/noticeReadyTaskBoundary.test.ts "
      - name: Focused Notice Ready test
        run: npx tsx lib/flow/noticeReadyTaskBoundary.test.ts
      - name: Full repository tests
        run: npm test
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Edge typecheck
        run: npm run ci:typecheck-edge
      - name: Locked prose
        run: npm run ci:verify-locked-prose
      - name: Banned terms
        run: npm run ci:verify-banned-terms
      - name: Commit bounded revision
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/notice-flow.tsx lib/flow/noticeReadyTaskBoundary.test.ts
          git commit -m "fix(nonpayment): keep planned-date guidance neutral"
          git push origin HEAD:fix/nonpayment-notice-ready-task-boundary
