name: UX2 Contract Separation Workbench

on:
  push:
    branches:
      - fix/nonpayment-one-review-confirm

permissions:
  contents: write

jobs:
  verify-and-commit:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply bounded contract separation correction
        run: python scripts/ux2_contract_separation_fix.py
      - name: Fix exact trailing-space defect
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('components/notice-flow.tsx')
          text = p.read_text()
          old = '  const noticePrepared = !!data.productionSnapshot && !evaluateStaleness(data).reason; \n'
          new = '  const noticePrepared = !!data.productionSnapshot && !evaluateStaleness(data).reason;\n'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one targeted trailing-space marker, found {count}')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Remove temporary workbench files
        run: rm scripts/ux2_contract_separation_fix.py .github/workflows/ux2-contract-separation-workbench.yml
      - name: Install dependencies
        run: npm install
      - name: Review approval binding
        run: npx tsx lib/flow/reviewApproval.test.ts
      - name: Create and Notice Ready boundary
        run: npx tsx lib/flow/noticeReadyTaskBoundary.test.ts
      - name: Existing staleness
        run: npx tsx lib/flow/escalation.test.ts
      - name: Production gate
        run: npx tsx lib/flow/gates.v4.test.ts
      - name: PR 361 source health regression
        run: npx tsx lib/jurisdiction/geocode/pathSpecificSourceHealth.test.ts
      - name: Full repository tests
        run: npm test
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Edge function typecheck
        run: npm run ci:typecheck-edge
      - name: Locked prose
        run: npm run ci:verify-locked-prose
      - name: Banned terms
        run: npm run ci:verify-banned-terms
      - name: Attorney attribution guard
        run: npm run ci:check-attorney-attribution
      - name: Classifier lock
        run: npm run ci:verify-classifier-lock
      - name: Geocode failure event lock
        run: npm run ci:verify-geocode-failure-event
      - name: Fetch binding lock
        run: npm run ci:verify-fetch-binding
      - name: Parcel health core sync
        run: npm run ci:verify-parcel-health-core-sync
      - name: Diff whitespace
        run: git diff --check
      - name: Commit verified correction
        run: |
          git config user.name "ownerpilot-workbench"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(nonpayment): keep approval identity separate from staleness"
          git push origin HEAD:fix/nonpayment-one-review-confirm